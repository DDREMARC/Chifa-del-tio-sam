<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Carta — El Tío Sam Chifa</title>
  <meta name="description" content="Carta completa de El Tío Sam Chifa: platos comunes, mixtos, guarniciones y dulces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/option-wheel.css">
  <link rel="stylesheet" href="../css/staggered-menu.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>

<body>

  <div id="staggeredMenu"></div>

  <section class="menu-header">
    <div class="container">
      <h1>La Carta</h1>
    </div>
  </section>

  <button class="wheel-trigger" id="wheelTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="wheelOverlay">
    <span id="wheelTriggerLabel">Todos</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div class="wheel-overlay" id="wheelOverlay">
    <div class="wheel-overlay__backdrop" id="wheelBackdrop"></div>
    <div class="wheel-overlay__panel">
      <div class="wheel-overlay__label">Desliza para elegir</div>
      <div id="categoryWheel"></div>
    </div>
  </div>

  <div id="menuGrid" class="container" style="transition:opacity .25s ease;">
    <!-- los platos se generan por JS -->
  </div>

  <footer class="site-foot">
    <div class="foot-inner">

      <div class="foot-brand">
        <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="seal__ring-out" cx="50" cy="50" r="46"/>
          <circle class="seal__ring-in" cx="50" cy="50" r="38"/>
          <path d="M50,50 C50,34 63,25 76,31 C83,34 83,45 76,48 C70,50.5 64,47 63,52 C61,60 68,65 62,70 C55,75 48,64 50,50 Z"/>
          <path transform="rotate(180 50 50)" d="M50,50 C50,34 63,25 76,31 C83,34 83,45 76,48 C70,50.5 64,47 63,52 C61,60 68,65 62,70 C55,75 48,64 50,50 Z"/>
        </svg>
        <div class="foot-brand__text">El Tío Sam<small>Chifa</small></div>
      </div>

      <div class="foot-cols">
        <div class="foot-col">
          <div class="foot-col__title">Ubicación</div>
          <div class="foot-col__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span>Jr. Cantón 245, Barrios Altos, Lima</span>
          </div>
          <div class="foot-col__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span>Martes a domingo · 12:00 m. – 10:00 p.m.</span>
          </div>
        </div>
        <div class="foot-col">
          <div class="foot-col__title">Contacto</div>
          <div class="foot-col__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4l2 5-2.5 1.5a12 12 0 0 0 6 6L15 14l5 2v4a2 2 0 0 1-2 2C9.5 22 2 14.5 2 6a2 2 0 0 1 2-2Z"/></svg>
            <a href="tel:+51987654321">+51 987 654 321</a>
          </div>
          <div class="foot-col__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
            <a href="https://wa.me/51987654321" target="_blank" rel="noopener">WhatsApp</a>
          </div>
        </div>
      </div>

      <div class="foot-col__title">Síguenos</div>
      <div class="foot-social">
        <a href="#" aria-label="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h3l1-4h-4V8a1 1 0 0 1 1-1h3V4Z"/></svg></a>
        <a href="#" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
        <a href="#" aria-label="TikTok" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg></a>
        <a href="#" aria-label="YouTube" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg></a>
      </div>

      <div class="foot-sep" style="margin-top:28px;"></div>

      <div class="foot-bottom">
        <span>© 2026 El Tío Sam Chifa</span>
        <span>·</span>
        <span>Lima, Perú</span>
        <span>·</span>
        <a href="https://maps.app.goo.gl/r69mdRCy9P4PaY7p6" target="_blank" rel="noopener">Cómo llegar</a>
      </div>

    </div>
  </footer>

  <script src="../js/option-wheel.js" defer></script>
  <script src="../js/menu-data.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/staggered-menu.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      createStaggeredMenu(document.getElementById('staggeredMenu'), {
        position: 'right',
        colors: ['#BE1A1A', '#2B0A0A'],
        accentColor: '#F7D87F',
        menuButtonColor: '#F7D87F',
        openMenuButtonColor: '#F7D87F',
        changeMenuColorOnOpen: true,
        displaySocials: true,
        displayItemNumbering: true,
        items: [
          { label: 'Inicio', ariaLabel: 'Ir al inicio', link: 'index.html' },
          { label: 'Carta', ariaLabel: 'Ver la carta', link: 'carta.html' },
          { label: 'Contacto', ariaLabel: 'Contactenos', link: 'contacto.html' },
        ],
        socialItems: [
          { label: 'Facebook', link: '#' },
          { label: 'Instagram', link: '#' },
          { label: 'TikTok', link: '#' },
          { label: 'WhatsApp', link: 'https://wa.me/51987654321' },
        ],
      });
    });
  </script>
</body>

</html>
